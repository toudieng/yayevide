# /etc/nginx/sites-available/yaayvide
# Un seul domaine : le site React + l'API Django + les photos.
# Remplacer yaayvide.com par le vrai domaine, puis lancer Certbot (voir
# DEPLOIEMENT.md) : il ajoute lui-même le bloc HTTPS et la redirection.

upstream yaayvide_django {
    server unix:/run/yaayvide/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name yaayvide.com www.yaayvide.com;

    # Photos des articles envoyées par les vendeuses
    client_max_body_size 25M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Site React (résultat de « npm run build ») ---
    root /srv/yaayvide/frontend/dist;
    index index.html;

    # Fichiers versionnés par Vite : mis en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API Django ---
    location /api/ {
        proxy_pass http://yaayvide_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Administration Django (même valeur que DJANGO_ADMIN_PATH) ---
    location /gestion-technique/ {
        proxy_pass http://yaayvide_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers de l'admin Django (collectstatic)
    location /static/ {
        alias /srv/yaayvide/backend/staticfiles/;
        expires 30d;
    }

    # Le PDF complet de l'e-book n'est JAMAIS servi directement :
    # seul TelechargerEbookView le donne, après paiement confirmé.
    location /media/ebook/complet/ {
        deny all;
    }

    # Photos (articles, catégories, boutiques, aperçu e-book)
    location /media/ {
        alias /srv/yaayvide/backend/media/;
        expires 7d;
    }

    # Toutes les autres adresses (/boutique, /produit/12, /admin…) : React
    location / {
        try_files $uri /index.html;
    }
}
